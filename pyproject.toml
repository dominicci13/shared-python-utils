[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seller-automation-utils"
version = "1.7.0"
description = "Shared Python utilities for Amazon and eBay seller automations"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "selenium>=4.0.0",
    "seleniumbase>=4.0.0",
    "xlwings>=0.30.0",
    "pandas>=2.0.0",
    "pyodbc>=5.0.0",
    "pywin32>=306",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    # Windows ships no IANA database, so zoneinfo has nothing to read without
    # this — ebay_api converts eBay's UTC timestamps to the seller's Pacific clock.
    "tzdata>=2024.1",
    # Capped below 4.0: APScheduler 4 drops the 3.x scheduler API this package
    # is built on (get_jobs()/next_run_time, add_listener event constants), so
    # an unpinned upgrade would break every automation in the fleet at once.
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]